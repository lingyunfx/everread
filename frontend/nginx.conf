# 前端静态文件 + /api 反向代理到 FastAPI；只有这个服务对外暴露端口
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 与后端 MAX_UPLOAD_MB 保持一致（略大一点给 multipart 头留余量）
    client_max_body_size 110m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # EPUB 在禁用脚本的 iframe 中渲染；书内资源通过 blob: 加载
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;

        # nginx 默认不认识 .mjs，PDF.js worker 是 ES 模块，必须以 JavaScript 类型返回
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
    }

    location / {
        try_files $uri /index.html;
    }
}
